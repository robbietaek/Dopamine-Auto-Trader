server:
  port: 8888

logging:
  level:
    org:
      springframework:
        boot:
          # 오류만 출력
          autoconfigure: ERROR

spring:
  # DB
  datasource:
    jdbc-url:
    driver-class-name: org.postgresql.Driver
    username:
    password:
    show-sql: true
    connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: HikariCP
      minimumIdle: 5
      maximumPoolSize: 50
      idleTimeout: 30000
      maxLifetime: 2000000
      connectionTimeout: 30000

